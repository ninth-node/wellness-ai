volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  chromadb_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  wellness-network:
    driver: bridge

# Development Services Quick Reference:
# - PostgreSQL: localhost:5432 (wellness_ai / wellness_user / wellness_dev_password)
# - Redis: localhost:6379 (password: redis_dev_password)
# - MinIO API: localhost:9000 (minio_admin / minio_dev_password)
# - MinIO Console: localhost:9001
# - ChromaDB: localhost:8001
# - PGAdmin: localhost:5050 (admin@wellness-ai.local / admin_dev_password)
# - Redis Commander: localhost:8081
# - MailHog SMTP: localhost:1025
# - MailHog UI: localhost:8025
# - Backend API: localhost:8000 (when uncommented)
# - Frontend: localhost:3000 (when uncommented)
