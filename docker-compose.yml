# AI-First Wellness & Beauty Management Platform
# Docker Compose for Local Development Environment

version: '3.8'

services:
  # PostgreSQL Database with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: wellness-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellness_ai
      POSTGRES_USER: wellness_user
      POSTGRES_PASSWORD: wellness_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wellness-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness_user -d wellness_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: wellness-ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wellness-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO - S3-compatible object storage for local development
  minio:
    image: minio/minio:latest
    container_name: wellness-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - wellness-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ChromaDB - Vector database for AI embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: wellness-ai-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - wellness-network

  # PGAdmin - Database management UI (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wellness-ai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wellness-ai.local
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - wellness-network
    depends_on:
      - postgres

  # Redis Commander - Redis management UI (optional, for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: wellness-ai-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_dev_password
    ports:
      - "8081:8081"
    networks:
      - wellness-network
    depends_on:
      - redis

  # Mailhog - Email testing server (for development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wellness-ai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - wellness-network

